  function applyRegion(city) {

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>

0a97033f-0158-44cd-9d7a-3dfc9669573f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* АРМА — colour tokens.\n   Two authentic sources coexist: the brandbook print palette (muted terracotta +\n   deep navy, pages 8 of the guide) and the web palette used on the live landing\n   pages in the Figma file (a hotter red, slightly different navy). Both are kept\n   verbatim; semantic aliases below choose per medium. */\n:root{\n  /* ── Navy / blue — brandbook (print) ───────────────────────────── */\n  --arma-navy-900:#191E2A;      /* основной цвет */\n  --arma-navy-800:#2A3247;      /* дополнительный синий */\n  --arma-steel-500:#647484;     /* холодный серо-синий */\n\n  /* ── Navy / blue — web (Figma landing) ─────────────────────────── */\n  --arma-ink:#191E2A;           /* сведён к основному цвету брендбука (было #121A2F / rgb(18,26,47) из Figma) */\n  --arma-ink-700:#3C4252;       /* rgb(60,66,82) — secondary copy */\n  --arma-slate-400:#717C99;     /* rgb(113,124,153) — footer links, captions */\n  --arma-hero-a:#12224E;        /* hero gradient stop 1 */\n  --arma-hero-b:#19233C;        /* hero gradient stop 2 */\n  --arma-hero-c:#0B183D;        /* hero gradient stop 3 */\n  --arma-dark-panel:#0E1426;    /* rgb(14,20,38) — dashed dark cards */\n  --arma-navy-mid:#2E405C;\n  --arma-navy-line:#343F5C;\n\n  /* ── Red / accent — brandbook (print) ──────────────────────────── */\n  --arma-terracotta:#D3625D;    /* акцент */\n  --arma-terracotta-700:#BD5954;\n  --arma-red-alt:#D5544D;\n  --arma-bordo-900:#4D1E1B;\n  --arma-bordo-800:#4C2E2E;\n  --arma-bordo-700:#533333;\n  --arma-bordo-600:#80322E;\n  --arma-gold:#CBA57D;          /* только акцентные элементы */\n\n  /* ── Red / accent — web (Figma landing) ────────────────────────── */\n  --arma-red:#E54038;           /* rgb(229,64,56) — primary web accent */\n  --arma-red-hot:#F83329;       /* gradient stop, light end */\n  --arma-red-deep:#C0362F;      /* gradient stop, dark end */\n  --arma-red-mid:#D24A43;\n  --arma-red-light:#E7534C;\n  --arma-maroon:#451A14;\n\n  /* ── Neutrals ──────────────────────────────────────────────────── */\n  --arma-white:#FEFEFE;\n  --arma-pure-white:#FFFFFF;\n  --arma-paper:#F4F6FB;         /* rgb(244,246,251) — page tint */\n  --arma-paper-2:#F5F6FB;       /* rgb(245,246,251) — card tint */\n  --arma-line:#DEE1EC;\n  --arma-line-2:#EAECF4;\n  --arma-mist:#AABBDC;\n  --arma-mute:#CACEDB;\n  --arma-silver:#C0C0C0;\n  --arma-gray-700:#5B5B5B;\n  --arma-gray-600:#989898;\n  --arma-gray-500:#808080;\n  --arma-black:#000000;\n\n  /* ── Status ────────────────────────────────────────────────────── */\n  --arma-green:#4BBB48;\n  --arma-green-700:#21A038;\n\n  /* ── Semantic — digital surfaces ───────────────────────────────── */\n  --text-heading:var(--arma-ink);\n  --text-body:var(--arma-ink);\n  --text-secondary:var(--arma-ink-700);\n  --text-muted:var(--arma-slate-400);\n  --text-inverse:var(--arma-pure-white);\n  --text-accent:var(--arma-red);\n\n  --surface-page:var(--arma-pure-white);\n  --surface-tint:var(--arma-paper);\n  --surface-card:var(--arma-pure-white);\n  --surface-card-tint:var(--arma-paper-2);\n  --surface-dark:var(--arma-hero-b);\n  --surface-dark-panel:rgba(14,20,38,0.4);\n\n  --accent:var(--arma-red);\n  --accent-strong:var(--arma-red-deep);\n  --accent-on:var(--arma-pure-white);\n\n  --border-hairline:var(--arma-line);\n  --border-hairline-soft:var(--arma-line-2);\n  --border-on-dark:rgba(255,255,255,0.1);\n  --border-dashed-dark:rgba(156,159,168,0.5);\n\n  --link:var(--arma-red);\n  --link-hover:var(--arma-red-deep);\n\n  /* ── Semantic — print / A4 documents (brandbook) ───────────────── */\n  --doc-text:var(--arma-black);\n  --doc-heading:var(--arma-navy-900);\n  --doc-subhead:var(--arma-navy-800);\n  --doc-meta:var(--arma-steel-500);\n  --doc-accent:var(--arma-terracotta);\n  --doc-accent-deep:var(--arma-bordo-900);\n  --doc-gold:var(--arma-gold);\n  --doc-paper:var(--arma-white);\n  --doc-rule:var(--arma-silver);\n}\n<\u002Fstyle>\n<style>/* АРМА — typography tokens.\n   Digital scale transcribed from the Figma landing frames (Circe → Nunito Sans).\n   Print scale transcribed from the brandbook бланк spec (Giga Sans → Manrope),\n   kept in pt because the source specifies pt and a 11.089 pt leading. */\n:root{\n  --font-core:'Manrope','Giga Sans',system-ui,-apple-system,'Segoe UI',sans-serif;   /* brandbook face */\n  --font-web:'Nunito Sans','Circe',system-ui,-apple-system,'Segoe UI',sans-serif;    /* landing face */\n  --font-display:var(--font-web); /* @kind font */\n  --font-body:var(--font-web); /* @kind font */\n  --font-doc:var(--font-core); /* @kind font */\n\n  --fw-regular:400; /* @kind other */\n  --fw-bold:700; /* @kind other */\n  --fw-extrabold:800; /* @kind other */\n\n  /* Digital scale — exact Figma sizes */\n  --fs-hero:56px;        /* hero headline, 800, 1.1 */\n  --fs-display:50px;     /* section headline, 800, 1.15 */\n  --fs-numeral-xl:134px; /* stat numerals, 800, 100% */\n  --fs-numeral-lg:80px;  /* card index numerals, 800, 100% */\n  --fs-price:36px;       /* tariff price, 800, 1.15 */\n  --fs-h3:30px; /* @kind font */\n  --fs-title:27px;       /* card titles / accordion questions, 700–800, 1.2 */\n  --fs-phone:26px;       /* header phone, 800 */\n  --fs-lead:24px;        /* lead-in line, 700, 100% */\n  --fs-name:23px;        /* person name, 800, 1.2 */\n  --fs-stat-cap:22px;    /* stat caption, 400, 1.4 */\n  --fs-tariff:20px;      /* tariff label, 800, 1.2 */\n  --fs-body:18px;        /* body copy, 400, 1.5 */\n  --fs-body-bold:18px;   /* list lead-in, 700, 1.2 */\n  --fs-ui:17px; /* @kind font */\n  --fs-meta:16px;        /* nav, header meta, bullet copy, 400/700 */\n  --fs-meta-sm:15px; /* @kind font */\n  --fs-caption:14px;     /* fine print, 1.3 */\n  --fs-btn-sm:13px;      /* pill button label, 700, 1.4 */\n  --fs-micro:10px;       /* logo tagline, 400, 100%, +0.03em */\n\n  --lh-tight:1.1; /* @kind other */\n  --lh-display:1.15; /* @kind other */\n  --lh-title:1.2; /* @kind other */\n  --lh-caption:1.3; /* @kind other */\n  --lh-stat:1.4; /* @kind other */\n  --lh-body:1.5; /* @kind other */\n  --lh-flat:100%; /* @kind other */\n  --ls-wide:0.03em;\n\n  /* Print scale — brandbook фирменный бланк */\n  --pt-doc-title:18pt; /* @kind other */      --pt-doc-title-lh:20pt; /* @kind other */\n  --pt-doc-subhead:10pt; /* @kind other */    --pt-doc-subhead-lh:11.089pt; /* @kind other */\n  --pt-doc-body:10pt; /* @kind other */       --pt-doc-body-lh:11.089pt; /* @kind other */\n  --pt-doc-meta:8pt; /* @kind other */        --pt-doc-meta-lh:11.089pt; /* @kind other */\n  --pt-doc-para-space:11.089pt; /* @kind other */\n  --pt-doc-subhead-space:12pt; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* АРМА — layout & spacing tokens.\n   Web: 1600 px frame, 1200 px content column, 200 px side gutters (Figma).\n   Print: A4 with a four-column modular grid, 10 mm module (brandbook). */\n:root{\n  --page-w:1600px; /* @kind spacing */\n  --content-w:1200px; /* @kind spacing */\n  --gutter:200px; /* @kind spacing */\n  --col-3:387px;          /* three-up card width inside 1200 (gap 20) */\n  --col-3-gap:20px; /* @kind spacing */\n  --col-2:590px; /* @kind spacing */\n  --card-pad:30px;        /* dark numbered cards */\n  --card-pad-lg:40px;     /* accordion rows */\n\n  --space-1:4px; /* @kind spacing */\n  --space-2:9px; /* @kind spacing */\n  --space-3:10px; /* @kind spacing */\n  --space-4:20px; /* @kind spacing */\n  --space-5:30px; /* @kind spacing */\n  --space-6:40px; /* @kind spacing */\n  --space-7:60px; /* @kind spacing */\n  --space-8:80px; /* @kind spacing */\n  --space-9:120px; /* @kind spacing */\n\n  --header-h:177px; /* @kind spacing */\n  --hero-h:900px;\n\n  /* Print — brandbook бланк */\n  --doc-w:210mm; /* @kind spacing */\n  --doc-h:297mm; /* @kind spacing */\n  --doc-module:10mm; /* @kind spacing */\n  --doc-margin-x:20mm; /* @kind spacing */\n  --doc-margin-top:45mm; /* @kind spacing */\n  --doc-margin-bottom:20mm; /* @kind spacing */\n  --doc-cols:4; /* @kind other */\n  --doc-col-gap:5mm; /* @kind spacing */\n  --card-w-visit:90mm; /* @kind spacing */\n  --card-h-visit:50mm; /* @kind spacing */\n}\n<\u002Fstyle>\n<style>/* АРМА — gradients, shadows, radii, motion. All values transcribed from Figma. */\n:root{\n  /* Accent gradient — every red button, pill and circle uses it, 270deg */\n  --grad-accent:linear-gradient(270deg,#F83329 5.71%,#C0362F 79.06%); /* @kind other */\n  --grad-accent-flat:linear-gradient(270deg,#F83329 0%,#C0362F 82.81%); /* @kind other */\n  /* Dark hero / header / footer wash */\n  --grad-hero:linear-gradient(232.062deg,rgba(18,34,78,0.94) 9.45%,#19233C 47.92%,rgba(11,24,61,0.9) 90.09%); /* @kind other */\n  --grad-header:linear-gradient(261.284deg,rgba(18,34,78,0.94) 13.37%,#19233C 48.01%,rgba(11,24,61,0.9) 85.99%); /* @kind other */\n\n  --shadow-cta:0 12px 45px rgba(210,57,49,0.36);\n  --shadow-icon-glow:0 0 10px 0 rgba(215,37,28,0.2);\n  --ring-accent:inset 0 0 0 2px #E54038; /* @kind shadow */\n\n  --radius-none:0;\n  --radius-pill:20px;\n  --radius-circle:50%;\n  --radius-hero:0 0 30px 30px;\n\n  /* Signature slanted CTA plate: 350×72 parallelogram, 20 px lean */\n  --cta-clip:polygon(0 0,94.286% 0,100% 100%,5.714% 100%); /* @kind other */\n  --cta-lean:20px; /* @kind other */\n\n  --ease-standard:cubic-bezier(.4,0,.2,1); /* @kind other */\n  --dur-fast:140ms; /* @kind other */\n  --dur-base:220ms; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* АРМА — minimal element defaults. Kept deliberately small: components carry\n   their own styling, this only stops browser defaults leaking through. */\nbody{margin:0;font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text-body);background:var(--surface-page);-webkit-font-smoothing:antialiased}\nh1,h2,h3,h4{margin:0;font-weight:var(--fw-extrabold);line-height:var(--lh-title);color:var(--text-heading)}\np{margin:0}\na{color:var(--link);text-decoration:none}\na:hover{color:var(--link-hover);text-decoration:underline}\nbutton{font-family:inherit}\nimg,svg{display:block}\n<\u002Fstyle>\n<style>/* АРМА — webfonts.\n   SUBSTITUTIONS (no font binaries were supplied with the sources):\n   • Giga Sans (brandbook corporate face, print + identity) → Manrope\n   • Circe (the face used throughout the Figma landing pages)  → Nunito Sans\n   Both substitutes carry full Cyrillic and match the originals' geometric-\n   humanist proportions. Replace these @import lines with @font-face rules\n   pointing at the licensed Giga Sans / Circe binaries when they arrive. */\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b6545392-085d-43d2-a913-957fc5a7cb51\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"ad56ab89-c0c8-4eb8-ad69-f58e1567a632\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"f2bfbb09-d190-4a5f-b54f-b1c022d91849\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"92768eb0-868e-4833-ad05-8c69cf28878d\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, .\n   Two authentic sources coexist: the brandbook print palette (muted terracotta +\n   deep navy, pages 8 of the guide) and the web palette used on the live landing\n   pages in the Figma file (a hotter red, slightly different navy). Both are kept\n   verbatim; semantic aliases below choose per medium. */\n:root{\n  /* ── Navy / blue — brandbook (print) ───────────────────────────── */\n  --arma-navy-900:#191E2A;      /* основной цвет */\n  --arma-navy-800:#2A3247;      /* дополнительный синий */\n  --arma-steel-500:#647484;     /* холодный серо-синий */\n\n  /* ── Navy / blue — web (Figma landing) ─────────────────────────── */\n  --arma-ink:#191E2A;           /* сведён к основному цвету брендбука (было #121A2F / rgb(18,26,47) из Figma) */\n  --arma-ink-700:#3C4252;       /* rgb(60,66,82) — secondary copy */\n  --arma-slate-400:#717C99;     /* rgb(113,124,153) — footer links, captions */\n  --arma-hero-a:#12224E;        /* hero gradient stop 1 */\n  --arma-hero-b:#19233C;        /* hero gradient stop 2 */\n  --arma-hero-c:#0B183D;        /* hero gradient stop 3 */\n  --arma-dark-panel:#0E1426;    /* rgb(14,20,38) — dashed dark cards */\n  --arma-navy-mid:#2E405C;\n  --arma-navy-line:#343F5C;\n\n  /* ── Red / accent — brandbook (print) ──────────────────────────── */\n  --arma-terracotta:#D3625D;    /* акцент */\n  --arma-terracotta-700:#BD5954;\n  --arma-red-alt:#D5544D;\n  --arma-bordo-900:#4D1E1B;\n  --arma-bordo-800:#4C2E2E;\n  --arma-bordo-700:#533333;\n  --arma-bordo-600:#80322E;\n  --arma-gold:#CBA57D;          /* только акцентные элементы */\n\n  /* ── Red / accent — web (Figma landing) ────────────────────────── */\n  --arma-red:#E54038;           /* rgb(229,64,56) — primary web accent */\n  --arma-red-hot:#F83329;       /* gradient stop, light end */\n  --arma-red-deep:#C0362F;      /* gradient stop, dark end */\n  --arma-red-mid:#D24A43;\n  --arma-red-light:#E7534C;\n  --arma-maroon:#451A14;\n\n  /* ── Neutrals ──────────────────────────────────────────────────── */\n  --arma-white:#FEFEFE;\n  --arma-pure-white:#FFFFFF;\n  --arma-paper:#F4F6FB;         /* rgb(244,246,251) — page tint */\n  --arma-paper-2:#F5F6FB;       /* rgb(245,246,251) — card tint */\n  --arma-line:#DEE1EC;\n  --arma-line-2:#EAECF4;\n  --arma-mist:#AABBDC;\n  --arma-mute:#CACEDB;\n  --arma-silver:#C0C0C0;\n  --arma-gray-700:#5B5B5B;\n  --arma-gray-600:#989898;\n  --arma-gray-500:#808080;\n  --arma-black:#000000;\n\n  /* ── Status ────────────────────────────────────────────────────── */\n  --arma-green:#4BBB48;\n  --arma-green-700:#21A038;\n\n  /* ── Semantic — digital surfaces ───────────────────────────────── */\n  --text-heading:var(--arma-ink);\n  --text-body:var(--arma-ink);\n  --text-secondary:var(--arma-ink-700);\n  --text-muted:var(--arma-slate-400);\n  --text-inverse:var(--arma-pure-white);\n  --text-accent:var(--arma-red);\n\n  --surface-page:var(--arma-pure-white);\n  --surface-tint:var(--arma-paper);\n  --surface-card:var(--arma-pure-white);\n  --surface-card-tint:var(--arma-paper-2);\n  --surface-dark:var(--arma-hero-b);\n  --surface-dark-panel:rgba(14,20,38,0.4);\n\n  --accent:var(--arma-red);\n  --accent-strong:var(--arma-red-deep);\n  --accent-on:var(--arma-pure-white);\n\n  --border-hairline:var(--arma-line);\n  --border-hairline-soft:var(--arma-line-2);\n  --border-on-dark:rgba(255,255,255,0.1);\n  --border-dashed-dark:rgba(156,159,168,0.5);\n\n  --link:var(--arma-red);\n  --link-hover:var(--arma-red-deep);\n\n  /* ── Semantic — print / A4 documents (brandbook) ───────────────── */\n  --doc-text:var(--arma-black);\n  --doc-heading:var(--arma-navy-900);\n  --doc-subhead:var(--arma-navy-800);\n  --doc-meta:var(--arma-steel-500);\n  --doc-accent:var(--arma-terracotta);\n  --doc-accent-deep:var(--arma-bordo-900);\n  --doc-gold:var(--arma-gold);\n  --doc-paper:var(--arma-white);\n  --doc-rule:var(--arma-silver);\n}\n\n/* АРМА — typography tokens.\n   Digital scale transcribed from the Figma landing frames (Circe → Nunito Sans).\n   Print scale transcribed from the brandbook бланк spec (Giga Sans → Manrope),\n   kept in pt because the source specifies pt and a 11.089 pt leading. */\n:root{\n  --font-core:'Manrope','Giga Sans',system-ui,-apple-system,'Segoe UI',sans-serif;   /* brandbook face */\n  --font-web:'Nunito Sans','Circe',system-ui,-apple-system,'Segoe UI',sans-serif;    /* landing face */\n  --font-display:var(--font-web); /* @kind font */\n  --font-body:var(--font-web); /* @kind font */\n  --font-doc:var(--font-core); /* @kind font */\n\n  --fw-regular:400; /* @kind other */\n  --fw-bold:700; /* @kind other */\n  --fw-extrabold:800; /* @kind other */\n\n  /* Digital scale — exact Figma sizes */\n  --fs-hero:56px;        /* hero headline, 800, 1.1 */\n  --fs-display:50px;     /* section headline, 800, 1.15 */\n  --fs-numeral-xl:134px; /* stat numerals, 800, 100% */\n  --fs-numeral-lg:80px;  /* card index numerals, 800, 100% */\n  --fs-price:36px;       /* tariff price, 800, 1.15 */\n  --fs-h3:30px; /* @kind font */\n  --fs-title:27px;       /* card titles / accordion questions, 700–800, 1.2 */\n  --fs-phone:26px;       /* header phone, 800 */\n  --fs-lead:24px;        /* lead-in line, 700, 100% */\n  --fs-name:23px;        /* person name, 800, 1.2 */\n  --fs-stat-cap:22px;    /* stat caption, 400, 1.4 */\n  --fs-tariff:20px;      /* tariff label, 800, 1.2 */\n  --fs-body:18px;        /* body copy, 400, 1.5 */\n  --fs-body-bold:18px;   /* list lead-in, 700, 1.2 */\n  --fs-ui:17px; /* @kind font */\n  --fs-meta:16px;        /* nav, header meta, bullet copy, 400/700 */\n  --fs-meta-sm:15px; /* @kind font */\n  --fs-caption:14px;     /* fine print, 1.3 */\n  --fs-btn-sm:13px;      /* pill button label, 700, 1.4 */\n  --fs-micro:10px;       /* logo tagline, 400, 100%, +0.03em */\n\n  --lh-tight:1.1; /* @kind other */\n  --lh-display:1.15; /* @kind other */\n  --lh-title:1.2; /* @kind other */\n  --lh-caption:1.3; /* @kind other */\n  --lh-stat:1.4; /* @kind other */\n  --lh-body:1.5; /* @kind other */\n  --lh-flat:100%; /* @kind other */\n  --ls-wide:0.03em;\n\n  /* Print scale — brandbook фирменный бланк */\n  --pt-doc-title:18pt; /* @kind other */      --pt-doc-title-lh:20pt; /* @kind other */\n  --pt-doc-subhead:10pt; /* @kind other */    --pt-doc-subhead-lh:11.089pt; /* @kind other */\n  --pt-doc-body:10pt; /* @kind other */       --pt-doc-body-lh:11.089pt; /* @kind other */\n  --pt-doc-meta:8pt; /* @kind other */        --pt-doc-meta-lh:11.089pt; /* @kind other */\n  --pt-doc-para-space:11.089pt; /* @kind other */\n  --pt-doc-subhead-space:12pt; /* @kind other */\n}\n\n/* АРМА — layout & spacing tokens.\n   Web: 1600 px frame, 1200 px content column, 200 px side gutters (Figma).\n   Print: A4 with a four-column modular grid, 10 mm module (brandbook). */\n:root{\n  --page-w:1600px; /* @kind spacing */\n  --content-w:1200px; /* @kind spacing */\n  --gutter:200px; /* @kind spacing */\n  --col-3:387px;          /* three-up card width inside 1200 (gap 20) */\n  --col-3-gap:20px; /* @kind spacing */\n  --col-2:590px; /* @kind spacing */\n  --card-pad:30px;        /* dark numbered cards */\n  --card-pad-lg:40px;     /* accordion rows */\n\n  --space-1:4px; /* @kind spacing */\n  --space-2:9px; /* @kind spacing */\n  --space-3:10px; /* @kind spacing */\n  --space-4:20px; /* @kind spacing */\n  --space-5:30px; /* @kind spacing */\n  --space-6:40px; /* @kind spacing */\n  --space-7:60px; /* @kind spacing */\n  --space-8:80px; /* @kind spacing */\n  --space-9:120px; /* @kind spacing */\n\n  --header-h:177px; /* @kind spacing */\n  --hero-h:900px;\n\n  /* Print — brandbook бланк */\n  --doc-w:210mm; /* @kind spacing */\n  --doc-h:297mm; /* @kind spacing */\n  --doc-module:10mm; /* @kind spacing */\n  --doc-margin-x:20mm; /* @kind spacing */\n  --doc-margin-top:45mm; /* @kind spacing */\n  --doc-margin-bottom:20mm; /* @kind spacing */\n  --doc-cols:4; /* @kind other */\n  --doc-col-gap:5mm; /* @kind spacing */\n  --card-w-visit:90mm; /* @kind spacing */\n  --card-h-visit:50mm; /* @kind spacing */\n}\n\n/* АРМА — gradients, shadows, radii, motion. All values transcribed from Figma. */\n:root{\n  /* Accent gradient — every red button, pill and circle uses it, 270deg */\n  --grad-accent:linear-gradient(270deg,#F83329 5.71%,#C0362F 79.06%); /* @kind other */\n  --grad-accent-flat:linear-gradient(270deg,#F83329 0%,#C0362F 82.81%); /* @kind other */\n  /* Dark hero / header / footer wash */\n  --grad-hero:linear-gradient(232.062deg,rgba(18,34,78,0.94) 9.45%,#19233C 47.92%,rgba(11,24,61,0.9) 90.09%); /* @kind other */\n  --grad-header:linear-gradient(261.284deg,rgba(18,34,78,0.94) 13.37%,#19233C 48.01%,rgba(11,24,61,0.9) 85.99%); /* @kind other */\n\n  --shadow-cta:0 12px 45px rgba(210,57,49,0.36);\n  --shadow-icon-glow:0 0 10px 0 rgba(215,37,28,0.2);\n  --ring-accent:inset 0 0 0 2px #E54038; /* @kind shadow */\n\n  --radius-none:0;\n  --radius-pill:20px;\n  --radius-circle:50%;\n  --radius-hero:0 0 30px 30px;\n\n  /* Signature slanted CTA plate: 350×72 parallelogram, 20 px lean */\n  --cta-clip:polygon(0 0,94.286% 0,100% 100%,5.714% 100%); /* @kind other */\n  --cta-lean:20px; /* @kind other */\n\n  --ease-standard:cubic-bezier(.4,0,.2,1); /* @kind other */\n  --dur-fast:140ms; /* @kind other */\n  --dur-base:220ms; /* @kind other */\n}\n\n/* АРМА — minimal element defaults. Kept deliberately small: components carry\n   their own styling, this only stops browser defaults leaking through. */\nbody{margin:0;font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text-body);background:var(--surface-page);-webkit-font-smoothing:antialiased}\nh1,h2,h3,h4{margin:0;font-weight:var(--fw-extrabold);line-height:var(--lh-title);color:var(--text-heading)}\np{margin:0}\na{color:var(--link);text-decoration:none}\na:hover{color:var(--link-hover);text-decoration:underline}\nbutton{font-family:inherit}\nimg,svg{display:block}\n\n<\u002Fstyle>\n<script src=\"f4121bda-1ab0-4fda-a802-3453f5e7c2db\"><\u002Fscript>\n<style>\n  html { scroll-behavior: smooth; }\n  body { margin: 0; background: var(--arma-pure-white); font-family: var(--font-web), system-ui, sans-serif; color: var(--arma-ink); -webkit-font-smoothing: antialiased; }\n  a { color: var(--arma-red); text-decoration: none; }\n  a:hover { color: var(--arma-red-deep); text-decoration: underline; }\n  input:focus-visible, button:focus-visible, label:focus-visible { outline: 2px solid var(--arma-red); outline-offset: 2px; }\n  @media (min-width: 861px) { .only-mobile { display: none !important; } }\n  @media (max-width: 860px) { .hide-mobile { display: none !important; } }\n  @keyframes armaRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<header style=\"position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);border-bottom:1px solid var(--arma-line);backdrop-filter:none\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px\">\n    <x-import component-from-global-scope=\"DesignSystem_b6e2ea.Logo\" height=\"{{ logoHeight }}\" tone=\"onLight\" hint-size=\"72px,44px\"><\u002Fx-import>\n    <div style=\"display:flex;align-items:center;gap:24px\">\n      <span class=\"hide-mobile\" style=\"display:flex;align-items:center;gap:8px;font-size:15px;color:var(--arma-ink-700)\">\n        <img src=\"35f3e59d-cf33-404e-86d8-26aacb7409ed\" alt=\"\" aria-hidden=\"true\" style=\"width:13px;height:16px;flex:none;opacity:.85\">\n        Работаем по всей России\n      <\u002Fspan>\n      <a href=\"tel:88003013699\" sc-camel-on-click=\"{{ onPhoneClick }}\" style=\"font-size:17px;font-weight:800;color:var(--arma-ink);white-space:nowrap\">8 (800) 301-36-99<\u002Fa>\n      <span class=\"hide-mobile\">\n        <x-import component-from-global-scope=\"DesignSystem_b6e2ea.Button\" variant=\"pill\" sc-camel-on-click=\"{{ onHeaderCta }}\" hint-size=\"200px,40px\">Получить консультацию<\u002Fx-import>\n      <\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main>\n<section style=\"position:relative;background:linear-gradient(232deg, rgba(18,34,78,.94), #19233C, rgba(11,24,61,.9));border-radius:0 0 30px 30px;overflow:hidden\">\n  <img src=\"cc150189-6cc5-4846-8c21-104b738229b2\" alt=\"\" aria-hidden=\"true\" style=\"position:absolute;right:-80px;top:0;height:100%;opacity:.35;pointer-events:none\">\n  <div style=\"position:relative;max-width:1200px;margin:0 auto;padding:clamp(36px,5vw,72px) 20px clamp(44px,5vw,80px);display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:clamp(28px,4vw,56px);align-items:start\">\n\n    <div>\n      <p style=\"margin:0 0 18px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--arma-mist);font-weight:700\">Юридическая и методическая помощь в образовании<\u002Fp>\n      <h1 style=\"margin:0;font-size:clamp(32px,4.3vw,56px);line-height:1.1;font-weight:800;color:var(--arma-pure-white);text-wrap:pretty\">Образовательная лицензия под ключ <span data-region-slot=\"1\" style=\"color:var(--arma-red-light)\">в вашем регионе<\u002Fspan><\u002Fh1>\n      <p style=\"margin:18px 0 0;font-size:clamp(16px,1.4vw,19px);line-height:1.55;color:#D6DCEC;max-width:560px;text-wrap:pretty\">Подготовим документы и образовательную программу, проверим вашу ситуацию и сопроводим процесс лицензирования до результата. Работаем дистанционно по всей России.<\u002Fp>\n\n      <ul style=\"list-style:none;margin:28px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 24px\">\n        <li style=\"display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.4;color:var(--arma-pure-white)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" fill=\"none\" aria-hidden=\"true\" style=\"flex:none;margin-top:2px\"><path d=\"M3.5 9.4 7.2 13 14.5 5.4\" stroke=\"#E54038\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Работаем с клиентами по всей России<\u002Fli>\n        <li style=\"display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.4;color:var(--arma-pure-white)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" fill=\"none\" aria-hidden=\"true\" style=\"flex:none;margin-top:2px\"><path d=\"M3.5 9.4 7.2 13 14.5 5.4\" stroke=\"#E54038\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Стоимость фиксируем в договоре<\u002Fli>\n        <li style=\"display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.4;color:var(--arma-pure-white)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" fill=\"none\" aria-hidden=\"true\" style=\"flex:none;margin-top:2px\"><path d=\"M3.5 9.4 7.2 13 14.5 5.4\" stroke=\"#E54038\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span><span data-count-slot=\"1\">1110<\u002Fspan>+ лицензий получено с нашей помощью<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.4;color:var(--arma-pure-white)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" fill=\"none\" aria-hidden=\"true\" style=\"flex:none;margin-top:2px\"><path d=\"M3.5 9.4 7.2 13 14.5 5.4\" stroke=\"#E54038\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Гарантии закреплены договором<\u002Fli>\n      <\u002Ful>\n\n      <div data-price-slot=\"1\" style=\"margin-top:26px;padding:14px 18px;border-left:3px solid var(--arma-red);background:rgba(14,20,38,.4);display:inline-flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline\">\n        <span style=\"font-size: 17px; color: rgb(214, 220, 236);\">Стоимость сопровождения —<\u002Fspan>\n        <strong style=\"font-size: 19px; font-weight: 800; color: var(--arma-pure-white);\">от <span data-price-value=\"1\">30&nbsp;000<\u002Fspan>&nbsp;₽<\u002Fstrong>\n        <span style=\"font-size: 14px; color: var(--arma-mist); width: 100%;\">Итоговая сумма фиксируется в договоре и не меняется по нашей инициативе<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:28px;max-width:420px\">\n        <x-import component-from-global-scope=\"DesignSystem_b6e2ea.Button\" variant=\"cta\" width=\"100%\" sc-camel-on-click=\"{{ onHeroCta }}\" style=\"width:100%\" hint-size=\"100%,72px\"><span data-cta-slot=\"1\">Получить расчёт и план лицензирования<\u002Fspan><\u002Fx-import>\n        <p style=\"margin:12px 0 0;font-size:14px;color:var(--arma-mist)\">Бесплатно. Без обязательств. Ответим по вашей ситуации.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--arma-pure-white);border-top:3px solid var(--arma-red);padding:clamp(24px,2.5vw,34px);box-shadow:0 24px 60px rgba(8,14,32,.35)\">\n      <p style=\"margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--arma-red)\">Персональный план лицензирования<\u002Fp>\n      <h2 style=\"margin:12px 0 0;font-size:clamp(22px,2vw,27px);line-height:1.25;font-weight:800;color:var(--arma-ink)\">После заявки бесплатно определим<\u002Fh2>\n      <ul style=\"list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column;gap:16px\">\n        <li style=\"display:flex;gap:12px;align-items:flex-start;font-size:17px;line-height:1.45;color:var(--arma-ink)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 18 18\" fill=\"none\" aria-hidden=\"true\" style=\"flex:none;margin-top:2px\"><circle cx=\"9\" cy=\"9\" r=\"9\" fill=\"#FDECEB\"><\u002Fcircle><path d=\"M4.6 9.3 7.6 12 13.2 6\" stroke=\"#E54038\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Какие документы нужны именно вам<\u002Fli>\n        <li style=\"display:flex;gap:12px;align-items:flex-start;font-size:17px;line-height:1.45;color:var(--arma-ink)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 18 18\" fill=\"none\" aria-hidden=\"true\" style=\"flex:none;margin-top:2px\"><circle cx=\"9\" cy=\"9\" r=\"9\" fill=\"#FDECEB\"><\u002Fcircle><path d=\"M4.6 9.3 7.6 12 13.2 6\" stroke=\"#E54038\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Что у вас уже есть, а что потребуется подготовить<\u002Fli>\n        <li style=\"display:flex;gap:12px;align-items:flex-start;font-size:17px;line-height:1.45;color:var(--arma-ink)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 18 18\" fill=\"none\" aria-hidden=\"true\" style=\"flex:none;margin-top:2px\"><circle cx=\"9\" cy=\"9\" r=\"9\" fill=\"#FDECEB\"><\u002Fcircle><path d=\"M4.6 9.3 7.6 12 13.2 6\" stroke=\"#E54038\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Стоимость сопровождения по вашей ситуации<\u002Fli>\n        <li style=\"display:flex;gap:12px;align-items:flex-start;font-size:17px;line-height:1.45;color:var(--arma-ink)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 18 18\" fill=\"none\" aria-hidden=\"true\" style=\"flex:none;margin-top:2px\"><circle cx=\"9\" cy=\"9\" r=\"9\" fill=\"#FDECEB\"><\u002Fcircle><path d=\"M4.6 9.3 7.6 12 13.2 6\" stroke=\"#E54038\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Оптимальный порядок получения лицензии<\u002Fli>\n      <\u002Ful>\n      <div style=\"margin-top:24px;padding-top:20px;border-top:1px dashed rgba(156,159,168,.5);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between\">\n        <span style=\"font-size:15px;color:var(--arma-ink-700)\">Сопровождение дистанционно<\u002Fspan>\n        <span data-region-slot=\"2\" style=\"font-size:15px;font-weight:800;color:var(--arma-ink)\">Ваш регион<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:var(--arma-paper);padding:clamp(48px,6vw,100px) 20px\">\n  <div style=\"max-width:1200px;margin:0 auto\">\n    <h2 style=\"margin:0;font-size:clamp(27px,3.4vw,50px);line-height:1.15;font-weight:800;color:var(--arma-ink);max-width:820px;text-wrap:pretty\">Берём лицензирование на себя<br><span style=\"color:var(--arma-red)\">от проверки ситуации до сопровождения подачи<\u002Fspan><\u002Fh2>\n\n    <div style=\"margin-top:clamp(28px,3vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px\">\n\n      <article style=\"background:var(--arma-pure-white);padding:clamp(24px,2.4vw,32px);display:flex;flex-direction:column;gap:16px\">\n        <h3 style=\"margin:0;font-size:clamp(20px,1.8vw,27px);line-height:1.25;font-weight:800;color:var(--arma-ink)\">Работаем по всей России<\u002Fh3>\n        <p style=\"margin:0;font-size:17px;line-height:1.5;color:var(--arma-ink-700)\">Большую часть процесса можно пройти дистанционно. Проверим вашу ситуацию и организуем сопровождение с учётом требований вашего региона.<\u002Fp>\n        <div style=\"margin-top:auto;padding-top:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--arma-line)\">\n          <span data-region-slot=\"3\" style=\"padding:8px 14px;background:var(--arma-paper);font-size:14px;font-weight:700;color:var(--arma-ink)\">Ваш регион<\u002Fspan>\n          <svg width=\"22\" height=\"12\" sc-camel-view-box=\"0 0 22 12\" fill=\"none\" aria-hidden=\"true\"><path d=\"M0 6h19M14.5 1.5 20 6l-5.5 4.5\" stroke=\"#E54038\" stroke-width=\"1.6\"><\u002Fpath><\u002Fsvg>\n          <span style=\"padding:8px 14px;background:var(--arma-ink);color:var(--arma-pure-white);font-size:14px;font-weight:700\">АРМА<\u002Fspan>\n          <svg width=\"22\" height=\"12\" sc-camel-view-box=\"0 0 22 12\" fill=\"none\" aria-hidden=\"true\"><path d=\"M0 6h19M14.5 1.5 20 6l-5.5 4.5\" stroke=\"#E54038\" stroke-width=\"1.6\"><\u002Fpath><\u002Fsvg>\n          <span style=\"padding:8px 14px;background:var(--arma-paper);font-size:14px;font-weight:700;color:var(--arma-ink)\">Лицензирование<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article style=\"background:var(--arma-pure-white);padding:clamp(24px,2.4vw,32px);display:flex;flex-direction:column;gap:16px\">\n        <h3 style=\"margin:0;font-size:clamp(20px,1.8vw,27px);line-height:1.25;font-weight:800;color:var(--arma-ink)\">Берём основную работу на себя<\u002Fh3>\n        <ol style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px\">\n          <li style=\"display:flex;gap:12px;align-items:center;font-size:16px;font-weight:700;color:var(--arma-ink);padding:10px 14px;background:var(--arma-paper-2)\"><span style=\"font-size:13px;font-weight:800;color:var(--arma-red)\">01<\u002Fspan>Аудит вашей ситуации<\u002Fli>\n          <li style=\"display:flex;gap:12px;align-items:center;font-size:16px;font-weight:700;color:var(--arma-ink);padding:10px 14px;background:var(--arma-paper-2)\"><span style=\"font-size:13px;font-weight:800;color:var(--arma-red)\">02<\u002Fspan>Документы<\u002Fli>\n          <li style=\"display:flex;gap:12px;align-items:center;font-size:16px;font-weight:700;color:var(--arma-ink);padding:10px 14px;background:var(--arma-paper-2)\"><span style=\"font-size:13px;font-weight:800;color:var(--arma-red)\">03<\u002Fspan>Образовательная программа<\u002Fli>\n          <li style=\"display:flex;gap:12px;align-items:center;font-size:16px;font-weight:700;color:var(--arma-ink);padding:10px 14px;background:var(--arma-paper-2)\"><span style=\"font-size:13px;font-weight:800;color:var(--arma-red)\">04<\u002Fspan>Подготовка к подаче<\u002Fli>\n          <li style=\"display:flex;gap:12px;align-items:center;font-size:16px;font-weight:700;color:var(--arma-ink);padding:10px 14px;background:var(--arma-paper-2)\"><span style=\"font-size:13px;font-weight:800;color:var(--arma-red)\">05<\u002Fspan>Сопровождение процесса<\u002Fli>\n        <\u002Fol>\n        <p style=\"margin:0;font-size:15px;line-height:1.5;color:var(--arma-ink-700)\">Вам не нужно самостоятельно разбираться в десятках требований и переделывать документы после ошибок.<\u002Fp>\n      <\u002Farticle>\n\n      <article style=\"background:var(--arma-pure-white);padding:clamp(24px,2.4vw,32px);display:flex;flex-direction:column;gap:16px\">\n        <h3 style=\"margin:0;font-size:clamp(20px,1.8vw,27px);line-height:1.25;font-weight:800;color:var(--arma-ink)\">Условия фиксируем в договоре<\u002Fh3>\n        <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px\">\n          <li style=\"display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.45;color:var(--arma-ink)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" fill=\"none\" aria-hidden=\"true\" style=\"flex:none;margin-top:2px\"><path d=\"M3.5 9.4 7.2 13 14.5 5.4\" stroke=\"#E54038\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span>Стоимость, указанная в договоре, окончательная и не меняется по инициативе «АРМА» <span style=\"color:var(--arma-slate-400)\">(п. 3.5 Договора)<\u002Fspan><\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.45;color:var(--arma-ink)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" fill=\"none\" aria-hidden=\"true\" style=\"flex:none;margin-top:2px\"><path d=\"M3.5 9.4 7.2 13 14.5 5.4\" stroke=\"#E54038\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span>При отказе лицензирующего органа по нашей вине возвращаем уплаченные средства в полном объёме <span style=\"color:var(--arma-slate-400)\">(п. 3.4 Договора)<\u002Fspan><\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.45;color:var(--arma-ink)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" fill=\"none\" aria-hidden=\"true\" style=\"flex:none;margin-top:2px\"><path d=\"M3.5 9.4 7.2 13 14.5 5.4\" stroke=\"#E54038\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span>За нарушение сроков — неустойка 0,1 % от стоимости услуг за каждый день просрочки <span style=\"color:var(--arma-slate-400)\">(п. 5.4 Договора)<\u002Fspan><\u002Fspan><\u002Fli>\n        <\u002Ful>\n        <p style=\"margin:auto 0 0;padding-top:16px;border-top:1px dashed rgba(156,159,168,.5);font-size:14px;line-height:1.5;color:var(--arma-slate-400)\">Решение о выдаче лицензии принимает лицензирующий орган. Мы отвечаем за подготовку и сопровождение — объём ответственности описан в договоре.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:20px;background:var(--arma-ink);padding:clamp(24px,3vw,40px);display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px\">\n      <div><p style=\"margin:0;font-size:clamp(38px,4vw,56px);font-weight:800;line-height:1;color:var(--arma-pure-white)\"><span data-count-slot=\"2\">1110<\u002Fspan>+<\u002Fp><p style=\"margin:8px 0 0;font-size:16px;line-height:1.4;color:var(--arma-mist)\">образовательных лицензий получено с нашей помощью<\u002Fp><\u002Fdiv>\n      <div><p style=\"margin:0;font-size:clamp(38px,4vw,56px);font-weight:800;line-height:1;color:var(--arma-pure-white)\">158<\u002Fp><p style=\"margin:8px 0 0;font-size:16px;line-height:1.4;color:var(--arma-mist)\">образовательных центров сопровождаем на постоянной основе<\u002Fp><\u002Fdiv>\n      <div><p style=\"margin:0;font-size:clamp(38px,4vw,56px);font-weight:800;line-height:1;color:var(--arma-pure-white)\">с 2013<\u002Fp><p style=\"margin:8px 0 0;font-size:16px;line-height:1.4;color:var(--arma-mist)\">года работаем в образовательном лицензировании<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    \n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"quiz\" style=\"background:var(--arma-pure-white);padding:clamp(48px,6vw,100px) 20px clamp(80px,7vw,110px)\">\n  <div style=\"max-width:840px;margin:0 auto\">\n    <h2 style=\"margin:0;font-size:clamp(26px,3.2vw,44px);line-height:1.15;font-weight:800;color:var(--arma-ink);text-wrap:pretty\">Узнайте стоимость образовательной лицензии для вашей ситуации<\u002Fh2>\n    <p style=\"margin:16px 0 0;font-size:clamp(16px,1.3vw,18px);line-height:1.55;color:var(--arma-ink-700)\">Ответьте на 3 коротких вопроса — определим объём работ, стоимость и следующий шаг.<\u002Fp>\n\n    <div style=\"margin-top:clamp(24px,3vw,40px);background:var(--arma-paper);padding:clamp(22px,3vw,44px)\">\n\n      <sc-if value=\"{{ showProgress }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-bottom:26px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700;color:var(--arma-ink-700)\">\n            <span>Шаг {{ stepNumber }} из 4<\u002Fspan>\n            <span style=\"color:var(--arma-slate-400);font-weight:400\">Занимает меньше минуты<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:10px;height:6px;background:var(--arma-line);overflow:hidden\">\n            <div style=\"{{ progressStyle }}\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showQuestion }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <h3 style=\"margin:0 0 20px;font-size:clamp(20px,2vw,27px);line-height:1.25;font-weight:800;color:var(--arma-ink)\">{{ questionTitle }}<\u002Fh3>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px\">\n            <sc-for list=\"{{ options }}\" as=\"opt\" hint-placeholder-count=\"4\">\n              <button type=\"button\" sc-camel-on-click=\"{{ opt.pick }}\" style=\"{{ opt.style }}\" style-hover=\"border-color:#E54038;color:#E54038\">{{ opt.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ canGoBack }}\" hint-placeholder-val=\"{{ false }}\">\n            <button type=\"button\" sc-camel-on-click=\"{{ onBack }}\" style=\"margin-top:20px;background:none;border:none;padding:8px 0;font:inherit;font-size:15px;color:var(--arma-slate-400);cursor:pointer\">← Назад<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showContact }}\" hint-placeholder-val=\"{{ false }}\">\n        <form sc-camel-on-submit=\"{{ onSubmit }}\" novalidate=\"novalidate\">\n          <h3 style=\"margin:0 0 8px;font-size:clamp(20px,2vw,27px);line-height:1.25;font-weight:800;color:var(--arma-ink)\">Готово. Куда отправить расчёт и план действий?<\u002Fh3>\n          <p style=\"margin:0 0 22px;font-size:16px;line-height:1.5;color:var(--arma-ink-700)\">Ответы записали. Специалист изучит их до звонка, чтобы разговор был по вашей ситуации.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px\">\n            <label style=\"display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:700;color:var(--arma-ink-700)\">Телефон\n              <input type=\"tel\" inputmode=\"tel\" name=\"phone\" value=\"{{ phone }}\" sc-camel-on-change=\"{{ onPhoneInput }}\" placeholder=\"+7 (___) ___-__-__\" autocomplete=\"tel\" style=\"{{ phoneFieldStyle }}\">\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:700;color:var(--arma-ink-700)\">Имя <span style=\"font-weight:400;color:var(--arma-slate-400)\">— необязательно<\u002Fspan>\n              <input type=\"text\" name=\"name\" value=\"{{ name }}\" sc-camel-on-change=\"{{ onNameInput }}\" placeholder=\"Как к вам обращаться\" autocomplete=\"name\" style=\"height:52px;padding:0 16px;border:1px solid var(--arma-line);background:var(--arma-pure-white);font:inherit;font-size:16px;color:var(--arma-ink)\">\n            <\u002Flabel>\n          <\u002Fdiv>\n          <sc-if value=\"{{ phoneError }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:8px 0 0;font-size:14px;color:var(--arma-red);font-weight:700\">{{ phoneError }}<\u002Fp>\n          <\u002Fsc-if>\n\n          <p style=\"margin:22px 0 10px;font-size:14px;font-weight:700;color:var(--arma-ink-700)\">Как удобнее связаться?<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n            <sc-for list=\"{{ channels }}\" as=\"ch\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ ch.pick }}\" style=\"{{ ch.style }}\">{{ ch.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <label style=\"margin-top:22px;display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.5;color:var(--arma-ink-700);cursor:pointer\">\n            <input type=\"checkbox\" checked=\"{{ agree }}\" sc-camel-on-change=\"{{ onAgreeChange }}\" style=\"width:20px;height:20px;flex:none;margin-top:1px;accent-color:#E54038\">\n            <span>Согласен на <a href=\"https://arma-jurist.ru/soglasie-na-obrabotku-personalnyh-dannyh\" target=\"_blank\" rel=\"noopener\">обработку персональных данных<\u002Fa> и ознакомлен с <a href=\"https://arma-jurist.ru/politika-konfidencialnosti\" target=\"_blank\" rel=\"noopener\">политикой конфиденциальности<\u002Fa><\u002Fspan>\n          <\u002Flabel>\n          <sc-if value=\"{{ agreeError }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:8px 0 0;font-size:14px;color:var(--arma-red);font-weight:700\">{{ agreeError }}<\u002Fp>\n          <\u002Fsc-if>\n\n          <div style=\"margin-top:24px;max-width:420px\">\n            <x-import component-from-global-scope=\"DesignSystem_b6e2ea.Button\" variant=\"cta\" width=\"100%\" type=\"submit\" disabled=\"{{ sending }}\" hint-size=\"100%,72px\">{{ submitLabel }}<\u002Fx-import>\n            <p style=\"margin:12px 0 0;font-size:14px;color:var(--arma-slate-400)\">Консультация и предварительный расчёт — бесплатно.<\u002Fp>\n          <\u002Fdiv>\n          <sc-if value=\"{{ submitError }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:14px 0 0;padding:12px 14px;border-left:3px solid var(--arma-red);background:#FDECEB;font-size:15px;color:var(--arma-ink)\">{{ submitError }}<\u002Fp>\n          <\u002Fsc-if>\n\n          <button type=\"button\" sc-camel-on-click=\"{{ onBack }}\" style=\"margin-top:18px;background:none;border:none;padding:8px 0;font:inherit;font-size:15px;color:var(--arma-slate-400);cursor:pointer\">← Назад к вопросам<\u002Fbutton>\n        <\u002Fform>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showSuccess }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"animation:armaRise .22s cubic-bezier(.4,0,.2,1) both\">\n          <div style=\"width:56px;height:56px;border-radius:50%;background:#FDECEB;display:flex;align-items:center;justify-content:center\">\n            <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 18 18\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3.5 9.4 7.2 13 14.5 5.4\" stroke=\"#E54038\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <h3 style=\"margin:20px 0 0;font-size:clamp(22px,2.4vw,32px);line-height:1.2;font-weight:800;color:var(--arma-ink)\">Заявка принята<\u002Fh3>\n          <p style=\"margin:14px 0 0;font-size:17px;line-height:1.55;color:var(--arma-ink-700);max-width:560px\">Специалист «АРМА» изучит ваши ответы и свяжется с вами для расчёта стоимости и плана лицензирования. Работаем Пн–Пт, 10:00–19:00 по московскому времени.<\u002Fp>\n          <p style=\"margin:22px 0 12px;font-size:15px;color:var(--arma-ink-700)\">А пока можете написать нам напрямую:<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n            <span sc-camel-on-click=\"{{ onMessengerClick }}\" style=\"display:inline-flex;align-items:center;gap:12px;padding:8px 18px 8px 8px;min-height:48px;background:var(--arma-pure-white);border:1px solid var(--arma-line)\">\n              <x-import component-from-global-scope=\"DesignSystem_b6e2ea.WhatsApp\" href=\"https://wa.me/79689845229\" icon=\"{{ waIcon }}\" hint-size=\"48px,48px\"><\u002Fx-import>\n              <a href=\"https://wa.me/79689845229\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--arma-ink);font-weight:700;font-size:15px\">WhatsApp<\u002Fa>\n            <\u002Fspan>\n            <span sc-camel-on-click=\"{{ onMessengerClick }}\" style=\"display:inline-flex;align-items:center;gap:12px;padding:8px 18px 8px 8px;min-height:48px;background:var(--arma-pure-white);border:1px solid var(--arma-line)\">\n              <x-import component-from-global-scope=\"DesignSystem_b6e2ea.Telegram\" href=\"https://t.me/+79689845229\" icon=\"{{ tgIcon }}\" hint-size=\"48px,48px\"><\u002Fx-import>\n              <a href=\"https://t.me/+79689845229\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--arma-ink);font-weight:700;font-size:15px\">Telegram<\u002Fa>\n            <\u002Fspan>\n            <a href=\"tel:88003013699\" sc-camel-on-click=\"{{ onPhoneClick }}\" style=\"display:inline-flex;align-items:center;gap:10px;padding:12px 18px;min-height:48px;background:var(--arma-pure-white);border:1px solid var(--arma-line);color:var(--arma-ink);font-weight:700;font-size:15px\">8 (800) 301-36-99<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n\n<footer style=\"background:var(--arma-dark-panel);padding:clamp(32px,4vw,56px) 20px calc(clamp(32px,4vw,56px) + 72px)\">\n  <div style=\"max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px;align-items:start\">\n    <div>\n      <x-import component-from-global-scope=\"DesignSystem_b6e2ea.Logo\" height=\"{{ logoHeight }}\" tone=\"onDark\" hint-size=\"72px,44px\"><\u002Fx-import>\n      <p style=\"margin:14px 0 0;font-size:15px;color:var(--arma-slate-400);max-width:280px\">Правовая и методическая помощь в образовании. Работаем дистанционно по всей России.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"font-size:15px;line-height:1.7;color:var(--arma-slate-400)\">\n      <a href=\"tel:88003013699\" sc-camel-on-click=\"{{ onPhoneClick }}\" style=\"color:var(--arma-pure-white);font-size:19px;font-weight:800\">8 (800) 301-36-99<\u002Fa>\n      <p style=\"margin:6px 0 0\">Звонок бесплатный по России · Пн–Пт, 10:00–19:00<\u002Fp>\n      <p style=\"margin:6px 0 0\"><a href=\"mailto:sale@arma-jurist.ru\" style=\"color:var(--arma-slate-400)\">sale@arma-jurist.ru<\u002Fa><\u002Fp>\n    <\u002Fdiv>\n    <div style=\"font-size:14px;line-height:1.6;color:var(--arma-slate-400)\">\n      <p style=\"margin:0\">ООО «АРМА», ИНН/КПП 7720444475/772001001, ОГРН 1187746817290. 105120, г. Москва, пер. Хлебников, д. 4, стр. 1, помещ. 3/1.<\u002Fp>\n      <p style=\"margin:10px 0 0;display:flex;flex-direction:column;gap:4px\">\n        <a href=\"https://arma-jurist.ru/politika-konfidencialnosti\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--arma-slate-400)\">Политика конфиденциальности<\u002Fa>\n        <a href=\"https://arma-jurist.ru/soglasie-na-obrabotku-personalnyh-dannyh\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--arma-slate-400)\">Согласие на обработку персональных данных<\u002Fa>\n      <\u002Fp>\n      <p style=\"margin:10px 0 0\">© 2026 Юридическая компания «АРМА»<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<div class=\"only-mobile\" style=\"{{ stickyStyle }}\">\n  <a href=\"tel:88003013699\" sc-camel-on-click=\"{{ onPhoneClick }}\" aria-label=\"Позвонить\" style=\"flex:none;width:52px;height:52px;border:1px solid var(--arma-line);display:flex;align-items:center;justify-content:center\">\n    <img src=\"31d2bddf-dd6c-4e26-87cc-348d2c198389\" alt=\"\" aria-hidden=\"true\" style=\"width:20px;height:20px\">\n  <\u002Fa>\n  <button type=\"button\" sc-camel-on-click=\"{{ onStickyCta }}\" style=\"flex:1;min-height:52px;border:none;background:linear-gradient(270deg,#F83329 5.71%,#C0362F 79.06%);color:#fff;font:inherit;font-size:16px;font-weight:800;cursor:pointer\">Получить расчёт<\u002Fbutton>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;h1Variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;A&quot;,&quot;B&quot;,&quot;C&quot;],&quot;default&quot;:&quot;A&quot;,&quot;tsType&quot;:&quot;'A'|'B'|'C'&quot;,&quot;section&quot;:&quot;A/B-тест&quot;},&quot;ctaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Получить расчёт и план лицензирования&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;A/B-тест&quot;},&quot;stickyMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;always&quot;,&quot;after-scroll&quot;],&quot;default&quot;:&quot;always&quot;,&quot;tsType&quot;:&quot;'always'|'after-scroll'&quot;,&quot;section&quot;:&quot;A/B-тест&quot;},&quot;priceFrom&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;30000&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Контент&quot;},&quot;showPrice&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Контент&quot;},&quot;licenseCount&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1110&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Контент&quot;},&quot;landingVersion&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;region-v1&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Интеграции&quot;},&quot;webhookUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://n8n-arma.online/webhook/arma-landing&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Интеграции&quot;},&quot;ymCounterId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Интеграции&quot;}}\">\nconst QUESTIONS = [\n  { key: 'format', title: 'Как планируете проводить обучение?', options: ['Онлайн', 'Очно', 'Онлайн + очно', 'Пока не определились'] },\n  { key: 'entity', title: 'Кто будет получать лицензию?', options: ['ИП', 'ООО / другая организация', 'Ещё не зарегистрированы', 'Не знаю, какой вариант выбрать'] },\n  { key: 'stage', title: 'На каком вы сейчас этапе?', options: ['Только планируем запуск', 'Уже готовим документы', 'Хотим подать документы в ближайшее время', 'Уже подавались / получили отказ'] }\n];\nconst H1 = {\n  A: 'Образовательная лицензия под ключ',\n  B: 'Поможем получить образовательную лицензию',\n  C: 'Образовательная лицензия для онлайн-школ и учебных центров — под ключ'\n};\n\nclass Component extends DCLogic {\n  state = {\n    step: 1, answers: {}, phone: '', name: '', channel: 'Телефон',\n    agree: false, phoneError: '', agreeError: '', submitError: '',\n    sending: false, done: false, started: false\n  };\n\n  componentDidMount() {\n    const p = new URLSearchParams(location.search);\n    const region = p.get('geo_region') || '';\n    // Склонённую фразу лендинг НЕ строит сам — её передаёт рекламная кампания: ?geo_phrase=в Екатеринбурге\n    const phraseRaw = (p.get('geo_phrase') || '').trim();\n    const phrase = /^(в|во|на)\\s+\\S/i.test(phraseRaw) ? phraseRaw : '';\n    this.meta = {\n      utm_source: p.get('utm_source') || '', utm_medium: p.get('utm_medium') || '',\n      utm_campaign: p.get('utm_campaign') || '', utm_content: p.get('utm_content') || '',\n      utm_term: p.get('utm_term') || '', yclid: p.get('yclid') || '',\n      geo_region: region, geo_phrase: phrase,\n      landing_version: p.get('landing_version') || this.props.landingVersion || 'region-v1'\n    };\n    this.initMetrika(p);\n    const root = this.el || document;\n    if (phrase) {\n      root.querySelectorAll('[data-region-slot=\"1\"]').forEach(n => { n.textContent = phrase; });\n      document.title = 'Образовательная лицензия ' + phrase + ' под ключ | АРМА';\n    }\n    if (region) root.querySelectorAll('[data-region-slot=\"2\"],[data-region-slot=\"3\"]').forEach(n => { n.textContent = region; });\n    const h1 = this.props.h1Variant;\n    if (h1 && h1 !== 'A') {\n      const node = root.querySelector('h1');\n      const span = node && node.querySelector('[data-region-slot=\"1\"]');\n      if (node && span) node.childNodes[0].textContent = H1[h1] + ' ';\n    }\n    const price = this.formatPrice(p.get('price') || this.props.priceFrom);\n    root.querySelectorAll('[data-price-value=\"1\"]').forEach(n => { n.textContent = price; });\n    this.priceText = price;\n    if (this.props.showPrice === false) root.querySelectorAll('[data-price-slot=\"1\"]').forEach(n => { n.style.display = 'none'; });\n    const count = this.props.licenseCount;\n    if (count) root.querySelectorAll('[data-count-slot=\"1\"],[data-count-slot=\"2\"]').forEach(n => { n.textContent = count; });\n    const cta = this.props.ctaLabel;\n    if (cta) root.querySelectorAll('[data-cta-slot=\"1\"]').forEach(n => { n.textContent = cta; });\n\n    if ((this.props.stickyMode || 'always') === 'after-scroll') {\n      const onScroll = () => {\n        const shown = window.pageYOffset > window.innerHeight * 0.28;\n        if (shown !== this.state.stickyVisible) this.setState({ stickyVisible: shown });\n      };\n      window.addEventListener('scroll', onScroll, { passive: true });\n      this.setState({ stickyVisible: false });\n      onScroll();\n    }\n\n    const io = new IntersectionObserver(entries => {\n      entries.forEach(e => { if (e.isIntersecting) { this.track('lead_form_view'); io.disconnect(); } });\n    }, { threshold: 0.3 });\n    const quiz = document.getElementById('quiz');\n    if (quiz) io.observe(quiz);\n  }\n\n  formatPrice(value) {\n    const raw = String(value == null ? '' : value).trim();\n    if (!raw) return '[УТОЧНИТЬ ЦЕНУ]';\n    const digits = raw.replace(/[\\s\\u00A0]/g, '');\n    if (!/^\\d+$/.test(digits)) return raw;\n    return Number(digits).toLocaleString('ru-RU').replace(/\\s/g, '\\u00A0');\n  }\n\n  initMetrika(params) {\n    const id = params.get('ym') || this.props.ymCounterId;\n    if (!id) return;\n    window.YM_COUNTER_ID = Number(id);\n    if (typeof window.ym === 'function') return;\n    window.ym = window.ym || function () { (window.ym.a = window.ym.a || []).push(arguments); };\n    window.ym.l = Date.now();\n    const s = document.createElement('script');\n    s.async = true;\n    s.src = 'https://mc.yandex.ru/metrika/tag.js';\n    document.head.appendChild(s);\n    window.ym(Number(id), 'init', { clickmap: true, trackLinks: true, accurateTrackBounce: true, webvisor: true });\n  }\n\n  track(name, params) {\n    const id = window.YM_COUNTER_ID;\n    const payload = Object.assign({}, this.meta || {}, params || {});\n    if (typeof window.ym === 'function' && id) window.ym(id, 'reachGoal', name, payload);\n    (window.dataLayer = window.dataLayer || []).push(Object.assign({ event: name }, payload));\n  }\n\n  scrollToQuiz = (from) => {\n    this.track(from);\n    if (!this.state.started) { this.track('quiz_start'); this.setState({ started: true }); }\n    const el = document.getElementById('quiz');\n    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset - 70, behavior: 'smooth' });\n  };\n\n  pick = (idx, value) => {\n    const q = QUESTIONS[idx];\n    if (!this.state.started) this.track('quiz_start');\n    this.track('quiz_step_' + (idx + 1) + '_complete', { answer: value });\n    this.setState(s => ({ started: true, answers: { ...s.answers, [q.key]: value }, step: s.step + 1 }));\n  };\n\n  back = () => this.setState(s => ({ step: Math.max(1, s.step - 1), submitError: '' }));\n\n  maskPhone(raw) {\n    let d = String(raw).replace(/\\D/g, '');\n    if (!d) return '';\n    if (d[0] === '8') d = '7' + d.slice(1);\n    if (d[0] !== '7') d = '7' + d;\n    d = d.slice(0, 11);\n    let out = '+7';\n    if (d.length > 1) out += ' (' + d.slice(1, 4);\n    if (d.length >= 5) out += ') ' + d.slice(4, 7);\n    if (d.length >= 8) out += '-' + d.slice(7, 9);\n    if (d.length >= 10) out += '-' + d.slice(9, 11);\n    return out;\n  }\n\n  submit = async (e) => {\n    e.preventDefault();\n    if (this.state.sending) return;\n    const digits = this.state.phone.replace(/\\D/g, '');\n    const phoneError = digits.length === 11 ? '' : 'Укажите номер телефона полностью';\n    const agreeError = this.state.agree ? '' : 'Нужно согласие на обработку персональных данных';\n    if (phoneError || agreeError) { this.setState({ phoneError, agreeError }); return; }\n    this.setState({ phoneError: '', agreeError: '', submitError: '', sending: true });\n    this.track('lead_submit');\n    const payload = {\n      phone: '+' + digits,\n      name: this.state.name,\n      preferred_contact: this.state.channel,\n      education_format: this.state.answers.format || '',\n      license_holder: this.state.answers.entity || '',\n      stage: this.state.answers.stage || '',\n      price_shown: this.priceText || '',\n      page_url: location.href,\n      referrer: document.referrer,\n      submitted_at: new Date().toISOString(),\n      ...this.meta\n    };\n    const url = (this.props.webhookUrl || '').trim();\n    if (!url) {\n      this.setState({ sending: false, submitError: 'Приём заявок не настроен: не задан адрес CRM/webhook. Заявка НЕ отправлена — укажите webhookUrl перед запуском рекламы.' });\n      return;\n    }\n    try {\n      const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });\n      if (!res.ok) throw new Error('bad status ' + res.status);\n      this.setState({ sending: false, done: true });\n      this.track('lead_success');\n    } catch (err) {\n      this.setState({ sending: false, submitError: 'Не удалось отправить заявку. Попробуйте ещё раз или позвоните: 8 (800) 301-36-99. Ваши ответы и номер сохранены.' });\n    }\n  };\n\n  optStyle(active) {\n    return 'display:flex;align-items:center;min-height:56px;padding:14px 18px;background:#FFFFFF;border:1px solid ' +\n      (active ? '#E54038' : 'var(--arma-line)') + ';font:inherit;font-size:16px;font-weight:700;text-align:left;color:' +\n      (active ? '#E54038' : 'var(--arma-ink)') + ';cursor:pointer;transition:border-color .16s cubic-bezier(.4,0,.2,1),color .16s cubic-bezier(.4,0,.2,1)';\n  }\n\n  renderVals() {\n    const { step, done, answers, sending } = this.state;\n    const qIdx = step - 1;\n    const q = QUESTIONS[qIdx];\n    const vals = {\n      logoHeight: 44,\n      waIcon: (window.__resources && window.__resources.waIcon) || 'assets/icons/whatsapp.svg',\n      tgIcon: (window.__resources && window.__resources.tgIcon) || 'assets/icons/telegram.svg',\n      stepNumber: Math.min(step, 4),\n      progressStyle: 'height:100%;width:' + (done ? 100 : Math.min(step, 4) / 4 * 100) + '%;background:linear-gradient(270deg,#F83329 5.71%,#C0362F 79.06%);transition:width .22s cubic-bezier(.4,0,.2,1)',\n      showProgress: !done,\n      showQuestion: !done && !!q,\n      showContact: !done && step === 4,\n      showSuccess: done,\n      canGoBack: step > 1,\n      questionTitle: q ? q.title : '',\n      options: q ? q.options.map(label => ({\n        label, style: this.optStyle(answers[q.key] === label), pick: () => this.pick(qIdx, label)\n      })) : [],\n      channels: ['Телефон', 'WhatsApp', 'Telegram'].map(label => ({\n        label, style: this.optStyle(this.state.channel === label).replace('min-height:56px', 'min-height:48px'),\n        pick: () => this.setState({ channel: label })\n      })),\n      phone: this.state.phone,\n      name: this.state.name,\n      agree: this.state.agree,\n      sending,\n      submitLabel: sending ? 'Отправляем…' : 'Получить расчёт и план',\n      phoneError: this.state.phoneError,\n      agreeError: this.state.agreeError,\n      submitError: this.state.submitError,\n      phoneFieldStyle: 'height:52px;padding:0 16px;border:1px solid ' + (this.state.phoneError ? '#E54038' : 'var(--arma-line)') + ';background:#FFFFFF;font:inherit;font-size:16px;color:var(--arma-ink)',\n      onPhoneInput: (e) => this.setState({ phone: this.maskPhone(e.target.value), phoneError: '' }),\n      onNameInput: (e) => this.setState({ name: e.target.value }),\n      onAgreeChange: (e) => this.setState({ agree: e.target.checked, agreeError: '' }),\n      onSubmit: this.submit,\n      onBack: this.back,\n      stickyStyle: 'position:fixed;left:0;right:0;bottom:0;z-index:50;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid var(--arma-line);gap:10px;align-items:center;transition:transform .18s cubic-bezier(.4,0,.2,1);display:flex;transform:translateY(' + (this.state.stickyVisible === false ? '110%' : '0') + ')',\n      onHeroCta: () => this.scrollToQuiz('hero_cta_click'),\n      onHeaderCta: () => this.scrollToQuiz('header_cta_click'),\n      onStickyCta: () => this.scrollToQuiz('sticky_cta_click'),\n      onPhoneClick: () => this.track('phone_click'),\n      onMessengerClick: () => this.track('messenger_click')\n    };\n    return vals;\n  }\n}\n\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
